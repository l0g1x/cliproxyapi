# CLIProxyAPI config — generated by `cpa` from config/config.template.yaml.
# Edit freely OUTSIDE the cpa-managed region; `cpa config sync-aliases` only rewrites that region.
# Full reference: https://github.com/router-for-me/CLIProxyAPI/blob/main/config.example.yaml

host: "{{HOST}}"
port: 8317
tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  allow-remote: false
  secret-key: ""            # empty = management API/panel disabled
  disable-control-panel: false

# OAuth credential files written by `auth-claude` / `auth-codex`
auth-dir: "{{AUTH_DIR}}"

# Bearer tokens clients (Claude Code, Codex, Cursor) send. Add more with `cpa key add`.
api-keys:
  - "{{API_KEY}}"

debug: false
logging-to-file: false
logs-max-total-size-mb: 0
error-logs-max-files: 10
usage-statistics-enabled: true
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
transient-error-cooldown-seconds: -1
disable-cooling: false

quota-exceeded:
  switch-project: true
  switch-preview-model: true

# Use the primary account until it hits quota, then fail over; keep a session on one account.
routing:
  strategy: "fill-first"
  session-affinity: true
  session-affinity-ttl: "1h"

ws-auth: true

# >>> cpa-managed aliases (generated from config/aliases.tsv — do not edit by hand) >>>
{{ALIASES}}
# <<< cpa-managed aliases <<<
