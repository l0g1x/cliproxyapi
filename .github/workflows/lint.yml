name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get install -y -q shellcheck
          shellcheck -x -S style bin/cpa lib/*.sh install.sh test/smoke.sh shell/aliases.sh
      - name: python
        run: python3 -m py_compile lib/*.py
      - name: smoke tests
        run: bash test/smoke.sh
